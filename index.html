<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ToDo-App</title>
</head>
<body>
    <header>
        <h1>My List</h1>
        <p>Track Your Tasks, Make progress!!</p>
    </header>

    <main>
        <div class="main-container">
            <form action="">
                <input type="text" name="" id="" placeholder="Enter Tasks" class="input-field">
                <button type="submit" class="submit-button header-button">Add</button>
                <!-- <button class="Clear-Tasks header-button">Clear</button> -->
                <input class="Clear-Tasks header-button" type="button" value="Clear"></button>
            </form>
    
            <div class="display-tasks">
                
            </div>
    
        </div>
        <div class="show-task">

        </div>
    </main>
        
</body>
<script src="script.js"></script>
</html>
